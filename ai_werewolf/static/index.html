<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI狼人杀</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>AI狼人杀</h1>
    <div class="mode-switch" role="group" aria-label="交互模式">
      <button id="mode-guided" class="active">引导模式</button>
      <button id="mode-fast">快速模式</button>
    </div>
    <div class="status-line">
      <span id="ai-mode-badge" class="badge"></span>
      <span id="status">未连接</span>
      <span id="room-info"></span>
    </div>
  </header>

  <main>
    <!-- 首页 -->
    <section id="home" class="panel">
      <div class="home-grid">
        <div class="home-col">
          <h2>你的经验</h2>
          <button id="exp-new" class="active">第一次玩（引导）</button>
          <button id="exp-vet">我会玩（快速）</button>
        </div>
        <div class="home-col">
          <h2>AI 对手</h2>
          <button id="ai-offline" class="active">离线演示 AI</button>
          <button id="ai-real">真实 LLM</button>
          <p id="ai-mode-note" class="muted"></p>
        </div>
        <div class="home-col">
          <h2>认识六名 AI</h2>
          <div id="persona-intro" class="persona-intro"></div>
        </div>
      </div>
      <button id="create-btn">创建房间并入座</button>
    </section>

    <!-- 入座等待 -->
    <section id="lobby" class="panel" hidden>
      <p>已入座，准备开始。</p>
      <button id="start-btn" disabled>开始游戏</button>
      <p id="lobby-note" class="muted"></p>
    </section>

    <!-- 对局 -->
    <section id="game" hidden>
      <div id="turn-banner" class="turn-banner" hidden>现在轮到你</div>
      <div id="top-bar" class="top-bar"></div>
      <div class="game-layout">
        <div id="table" class="table"></div>
        <aside id="right" class="panel">
          <div id="copilot"></div>
          <div id="private-info" class="private-info"></div>
        </aside>
      </div>
      <div id="decision"></div>
      <button id="drawer-toggle" class="ghost">完整日志（折叠）</button>
      <div id="drawer" class="drawer" hidden><div id="feed" class="feed"></div></div>
    </section>

    <!-- 终局 -->
    <section id="result" class="panel" hidden>
      <h2>对局结束</h2>
      <div id="result-body"></div>
      <div id="recap" class="recap"></div>
      <button id="replay-btn">查看回放</button>
      <button id="again-btn">再来一局</button>
      <button id="home-btn" class="ghost">回到大厅</button>
      <div id="replay" class="log" hidden></div>
    </section>
  </main>

  <div id="identity-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="identity-role"></h2>
      <div id="identity-faction" class="identity-line"></div>
      <div id="identity-goal" class="identity-line"></div>
      <div id="identity-ability" class="identity-line"></div>
      <div id="identity-mates" class="identity-line" hidden></div>
      <button id="identity-confirm">我知道了</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
