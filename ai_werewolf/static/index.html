<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI狼人杀</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>AI狼人杀</h1>
    <div class="mode-switch" role="group" aria-label="交互模式">
      <button id="mode-guided" class="active">引导模式</button>
      <button id="mode-fast">快速模式</button>
    </div>
    <div class="status-line"><span id="status">未连接</span><span id="room-info"></span></div>
  </header>

  <main>
    <section id="lobby" class="panel">
      <p>1 名真人 + 6 名不同人格 AI 的 7 人局。</p>
      <button id="create-btn">创建房间并入座</button>
      <button id="start-btn" disabled>开始游戏</button>
      <p id="lobby-note" class="muted"></p>
    </section>

    <section id="game" class="game-grid" hidden>
      <div id="turn-banner" class="turn-banner" hidden>现在轮到你</div>

      <aside id="left" class="panel">
        <div id="phase" class="phase"></div>
        <div id="role" class="role"></div>
        <h3>玩家座位</h3>
        <div id="seats"></div>
        <button id="exit-btn" class="ghost" style="margin-top:1rem">退出本局</button>
      </aside>

      <section id="center" class="panel">
        <div id="phase-card"></div>
        <div id="decision"></div>
        <div id="feed" class="feed"></div>
      </section>

      <aside id="right" class="panel">
        <div id="copilot"></div>
      </aside>
    </section>

    <section id="result" class="panel" hidden>
      <h2>对局结束</h2>
      <div id="result-body"></div>
      <div id="recap" class="recap"></div>
      <button id="replay-btn">查看回放</button>
      <button id="again-btn">再来一局</button>
      <button id="home-btn" class="ghost">回到大厅</button>
      <div id="replay" class="log" hidden></div>
    </section>
  </main>

  <div id="identity-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="identity-role"></h2>
      <div id="identity-faction" class="identity-line"></div>
      <div id="identity-goal" class="identity-line"></div>
      <div id="identity-ability" class="identity-line"></div>
      <div id="identity-mates" class="identity-line" hidden></div>
      <button id="identity-confirm">我知道了</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
