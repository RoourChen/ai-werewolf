[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-werewolf"
version = "0.2.0"
description = "AI狼人杀 — 面向真人与 AI 多智能体对战的狼人杀引擎（房间、匹配、裁判状态机、Copilot、观战回放、战绩与后台）。"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AI狼人杀 contributors" }]
keywords = ["werewolf", "mafia", "llm", "agents", "multi-agent", "social-deduction", "game-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/RoourChen/ai-werewolf"
Repository = "https://github.com/RoourChen/ai-werewolf"
Issues = "https://github.com/RoourChen/ai-werewolf/issues"
Changelog = "https://github.com/RoourChen/ai-werewolf/blob/main/CHANGELOG.md"

[project.scripts]
ai-werewolf = "ai_werewolf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_werewolf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
